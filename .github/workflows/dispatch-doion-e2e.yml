name: Dispatch Doion E2E

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  dispatch-e2e:
    name: Dispatch E2E to Doion
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    steps:
      - name: Send repository dispatch to alamalhoda/doion
        env:
          DISPATCH_TOKEN: ${{ secrets.DOION_E2E_DISPATCH_TOKEN }}
        run: |
          UI_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Preparing E2E repository dispatch to alamalhoda/doion for UI commit SHA: ${UI_SHA}"

          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::error::Secret DOION_E2E_DISPATCH_TOKEN is missing or empty. Please add DOION_E2E_DISPATCH_TOKEN to repository secrets (a PAT with permissions to POST repository_dispatch to alamalhoda/doion)."
            exit 1
          fi

          if ! [[ "$UI_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid UI SHA format: ${UI_SHA}. Expected a 40-character hex commit SHA."
            exit 1
          fi

          PAYLOAD=$(printf '{"event_type":"frontend-e2e","client_payload":{"ui_sha":"%s"}}' "$UI_SHA")

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/alamalhoda/doion/dispatches \
            -d "$PAYLOAD")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully dispatched frontend-e2e to alamalhoda/doion with ui_sha=${UI_SHA} (HTTP ${HTTP_CODE})."
          else
            echo "::error::Failed to dispatch repository_dispatch to alamalhoda/doion. HTTP status code: ${HTTP_CODE}."
            exit 1
          fi
