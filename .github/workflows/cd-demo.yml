name: CD Demo (Chabokan mock)

on:
  push:
    branches: [main]

jobs:
  deploy-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (lint)
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build MOCK demo
        env:
          VITE_USE_MOCK: "true"
        run: bun run build

      - name: Setup Node.js (for Chabokan CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Deploy to Chabokan
        env:
          CHABOKAN_TOKEN: ${{ secrets.CHABOKAN_TOKEN }}
        run: |
          npm install -g @chabokan.net/cli
          # .gitignore contains dist/ by default. Remove dist/ from .gitignore on runner so CLI uploads built assets.
          sed -i '/dist\//d' .gitignore || true
          chabok login -t "$CHABOKAN_TOKEN"
          chabok deploy -s chequeyar-front-demo
