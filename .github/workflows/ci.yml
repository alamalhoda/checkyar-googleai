name: CI

on:
  push:
    branches: [main, product]
  pull_request:
    branches: [main, product]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (lint)
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Build production app
        run: bun run build

      - name: Build production app (live, non-mock)
        env:
          VITE_USE_MOCK: "false"
          VITE_API_BASE_URL: "https://chequeyar-back.chbkn.dev/api/v1"
        run: bun run build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_USE_MOCK="false" \
            --build-arg VITE_API_BASE_URL="https://chequeyar-back.chbkn.dev/api/v1" \
            -t checkyar-frontend:ci .
