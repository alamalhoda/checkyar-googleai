<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>چک‌یار | سامانه معامله و مدیریت چِک و مطالبات (Cheque Yar)</title>
    <link rel="preload" href="/fonts/vazirmatn/vazirmatn-v33-latin-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      body {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div
        id="app-initial-loading"
        data-testid="landing-loading"
        dir="rtl"
        style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;"
      >
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px; border-radius: 16px; background-color: #0f172a; border: 1px solid #1e293b; max-width: 320px; width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);">
          <div style="width: 48px; height: 48px; border-radius: 12px; background-color: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.25); display: flex; align-items: center; justify-content: center; color: #10b981; font-weight: bold; font-size: 22px;">
            چ
          </div>
          <div style="font-size: 15px; font-weight: 600; color: #f8fafc;">
            چک‌یار
          </div>
          <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #94a3b8;">
            <div style="width: 8px; height: 8px; border-radius: 50%; background-color: #10b981; animation: pulse 1.5s infinite;"></div>
            <span>در حال بارگذاری سامانه...</span>
          </div>
        </div>
        <style>
          @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
