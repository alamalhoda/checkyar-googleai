<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Slide 2: Problem - Friction, Locked Liquidity & Traditional Brokerage -->
  <defs>
    <linearGradient id="probGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Disconnected Mesh -->
  <g opacity="0.2">
    <line x1="80" y1="90" x2="220" y2="130" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="220" y1="130" x2="290" y2="210" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 6"/>
    <line x1="380" y1="190" x2="520" y2="280" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>

  <!-- 3 Problem Blocks -->
  <!-- Block 1: Locked Capital -->
  <g transform="translate(90, 80)">
    <rect width="180" height="110" rx="14" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.8"/>
    <!-- Lock graphic -->
    <rect x="24" y="44" width="32" height="26" rx="6" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <path d="M32 44V34a8 8 0 0 1 16 0v10" stroke="#f43f5e" stroke-width="1.5" fill="none"/>
    <circle cx="40" cy="57" r="2.5" fill="#f43f5e"/>
    <!-- Text Representation Bars -->
    <rect x="70" y="38" width="80" height="8" rx="4" fill="#f8fafc" opacity="0.9"/>
    <rect x="70" y="54" width="60" height="6" rx="3" fill="#64748b"/>
    <rect x="70" y="68" width="70" height="6" rx="3" fill="#f43f5e" opacity="0.6"/>
  </g>

  <!-- Block 2: Middleman Gap / Fragmentation (Center Interrupted Node) -->
  <g transform="translate(330, 80)">
    <rect width="180" height="110" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="40" cy="55" r="18" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <path d="M33 55l14 0M40 48l0 14" stroke="#f59e0b" stroke-width="2" transform="rotate(45 40 55)"/>
    <rect x="70" y="38" width="80" height="8" rx="4" fill="#f8fafc" opacity="0.9"/>
    <rect x="70" y="54" width="50" height="6" rx="3" fill="#64748b"/>
    <rect x="70" y="68" width="65" height="6" rx="3" fill="#f59e0b" opacity="0.6"/>
  </g>

  <!-- Block 3: Asymmetric High Discount Rates -->
  <g transform="translate(210, 230)">
    <rect width="200" height="115" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <!-- Volatility Chart line downward -->
    <path d="M30 85 L 60 70 L 90 90 L 120 45 L 150 75 L 175 35" stroke="#f43f5e" stroke-width="2" fill="none"/>
    <circle cx="175" cy="35" r="4" fill="#f43f5e"/>
    <rect x="30" y="20" width="90" height="8" rx="4" fill="#f8fafc" opacity="0.9"/>
    <rect x="30" y="34" width="60" height="6" rx="3" fill="#94a3b8"/>
  </g>

  <!-- Warning Indicators -->
  <circle cx="180" cy="190" r="16" fill="#020617" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="180" y="196" fill="#f43f5e" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">!</text>

  <circle cx="420" cy="190" r="16" fill="#020617" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="420" y="196" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">٪</text>
</svg>
