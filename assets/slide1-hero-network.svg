<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGlow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background Subtle Grid -->
  <g opacity="0.15">
    <path d="M50 50h500M50 125h500M50 200h500M50 275h500M50 350h500" stroke="#334155" stroke-width="1" stroke-dasharray="4 6"/>
    <path d="M100 30v340M225 30v340M350 30v340M475 30v340" stroke="#334155" stroke-width="1" stroke-dasharray="4 6"/>
  </g>

  <!-- Central Dynamic Rings -->
  <circle cx="300" cy="200" r="140" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="95" stroke="#334155" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="300" cy="200" r="55" fill="url(#bgGlow1)" stroke="#10b981" stroke-width="2"/>

  <!-- Network Interconnection Paths -->
  <path d="M120 140 Q 210 100 300 145 T 480 120" stroke="url(#lineGrad1)" stroke-width="2" fill="none"/>
  <path d="M140 280 Q 220 220 300 255 T 460 260" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6" fill="none"/>
  <path d="M160 190 L 245 200 L 300 200 L 355 200 L 440 210" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M300 60 L 300 145" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>
  <path d="M300 255 L 300 340" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Active Nodes (Holders / Investors / Platform) -->
  <!-- Center Core Node: Cheque Yar Engine -->
  <rect x="275" y="175" width="50" height="50" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="300" y="206" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">چک</text>

  <!-- Left Side: Cheque Holders Nodes -->
  <g transform="translate(120, 140)">
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#10b981"/>
  </g>
  <g transform="translate(140, 280)">
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#64748b"/>
  </g>
  <g transform="translate(160, 190)">
    <rect x="-12" y="-12" width="24" height="24" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#34d399"/>
  </g>

  <!-- Right Side: Investors Nodes -->
  <g transform="translate(480, 120)">
    <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="#34d399"/>
  </g>
  <g transform="translate(460, 260)">
    <rect x="-14" y="-14" width="28" height="28" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#10b981"/>
  </g>
  <g transform="translate(440, 210)">
    <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#64748b"/>
  </g>

  <!-- Orbiting Data Particles -->
  <circle cx="220" cy="115" r="3" fill="#34d399"/>
  <circle cx="380" cy="125" r="3.5" fill="#10b981"/>
  <circle cx="235" cy="240" r="3" fill="#34d399"/>
  <circle cx="370" cy="258" r="3" fill="#10b981"/>
</svg>
