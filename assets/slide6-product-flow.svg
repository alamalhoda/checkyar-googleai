<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Slide 6: Product Flow (Listing -> KYC -> Moderation -> Matching -> Match Accept -> Settlement Confirmation) -->
  <g transform="translate(40, 80)">
    <!-- Step 1: Listing Creation -->
    <g transform="translate(0, 0)">
      <rect width="95" height="110" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="47" cy="30" r="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="47" y="35" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">۱</text>
      <text x="47" y="65" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ثبت آگهی</text>
      <text x="47" y="82" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">مشخصات چک صیاد</text>
      <text x="47" y="95" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">+ آپلود مدارک</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M100 55 L 115 55" stroke="#10b981" stroke-width="2"/>

    <!-- Step 2: KYC & Verification -->
    <g transform="translate(120, 0)">
      <rect width="95" height="110" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="47" cy="30" r="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="47" y="35" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">۲</text>
      <text x="47" y="65" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">احراز هویت</text>
      <text x="47" y="82" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">حقیقی (کدملی)</text>
      <text x="47" y="95" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">حقوقی (شناسه‌ملی)</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M220 55 L 235 55" stroke="#3b82f6" stroke-width="2"/>

    <!-- Step 3: Moderation -->
    <g transform="translate(240, 0)">
      <rect width="95" height="110" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="47" cy="30" r="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="47" y="35" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">۳</text>
      <text x="47" y="65" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">صف نظارت</text>
      <text x="47" y="82" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">بررسی مدارک ناظر</text>
      <text x="47" y="95" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">+ تعیین سطح ریسک</text>
    </g>

    <!-- Arrow 3 to 4 -->
    <path d="M340 55 L 355 55" stroke="#f59e0b" stroke-width="2"/>

    <!-- Step 4: Marketplace Discovery -->
    <g transform="translate(360, 0)">
      <rect width="95" height="110" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="47" cy="30" r="14" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="47" y="35" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">۴</text>
      <text x="47" y="65" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">کشف در بازارچه</text>
      <text x="47" y="82" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">فیلتر سررسید، بانک</text>
      <text x="47" y="95" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">نرخ پیشنهادی stub</text>
    </g>

    <!-- Arrow 4 to 5 (down & back) -->
    <path d="M410 115 L 410 145 L 370 145" stroke="#10b981" stroke-width="2"/>

    <!-- Step 5: Express Interest / Match Request -->
    <g transform="translate(240, 140)">
      <rect width="115" height="95" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="57" y="25" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">۵. ابراز تمایل (Match)</text>
      <text x="57" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="8.5" text-anchor="middle">ارسال نرخ پیشنهادی خریدار</text>
      <text x="57" y="68" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">پذیرش / رد توسط دارنده چک</text>
    </g>

    <!-- Arrow 5 to 6 -->
    <path d="M235 188 L 195 188" stroke="#10b981" stroke-width="2"/>

    <!-- Step 6: Outside Settlement Verification -->
    <g transform="translate(70, 140)">
      <rect width="120" height="95" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <text x="60" y="25" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">۶. تسویه بیرون پلتفرم</text>
      <text x="60" y="48" fill="#cbd5e1" font-family="sans-serif" font-size="8.5" text-anchor="middle">انتقال در صیاد + واریز وجه</text>
      <text x="60" y="68" fill="#10b981" font-family="sans-serif" font-size="8" font-weight="bold" text-anchor="middle">تأیید دوطرفه معامله</text>
    </g>
  </g>
</svg>
