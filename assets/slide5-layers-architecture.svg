<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Slide 5: 3-Layer Architecture Roadmap -->
  <!-- Layer 1: Marketplace (Active / Pilot Ready) -->
  <g transform="translate(60, 60)">
    <rect width="480" height="85" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="20" y="20" width="45" height="45" rx="10" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <text x="42" y="48" fill="#34d399" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">۱</text>
    
    <text x="80" y="38" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">لایه ۱ — بازارچه اطلاعاتی و اتصال‌دهنده (Marketplace)</text>
    <text x="80" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">کشف فرصت، پیشنهاد نرخ، تطبیق طرفین | تسویه بیرون پلتفرم | بدون لمس وجه</text>

    <rect x="360" y="28" width="100" height="28" rx="14" fill="#10b981"/>
    <text x="410" y="47" fill="#020617" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">v1 آماده پایلوت</text>
  </g>

  <!-- Flow Connector Line 1 to 2 -->
  <line x1="300" y1="145" x2="300" y2="165" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer 2: Escrow & Guarantee (Future) -->
  <g transform="translate(60, 165)">
    <rect width="480" height="85" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="20" width="45" height="45" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="42" y="48" fill="#60a5fa" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">۲</text>
    
    <text x="80" y="38" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">لایه ۲ — حساب امانی و ضمانت وصول (Escrow + Guarantee)</text>
    <text x="80" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">نگهداری امانی چک و وجه، رتبه‌بندی ریسک پیشرفته، مدل درآمدی امانت‌داری</text>

    <rect x="360" y="28" width="100" height="28" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="410" y="46" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">فاز توسعه آتی</text>
  </g>

  <!-- Flow Connector Line 2 to 3 -->
  <line x1="300" y1="250" x2="300" y2="270" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer 3: Direct Principal / Factoring (Vision) -->
  <g transform="translate(60, 270)">
    <rect width="480" height="85" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="20" width="45" height="45" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="42" y="48" fill="#fbbf24" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">۳</text>
    
    <text x="80" y="38" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">لایه ۳ — خرید مستقیم ترازنامه‌ای (Principal / Factoring)</text>
    <text x="80" y="58" fill="#94a3b8" font-family="sans-serif" font-size="11">خرید و تملک مستقیم چک توسط نهاد با پشتوانه خط اعتباری و مجوز بانک مرکزی</text>

    <rect x="360" y="28" width="100" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
    <text x="410" y="46" fill="#fcd34d" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">چشم‌انداز مقیاس</text>
  </g>
</svg>
