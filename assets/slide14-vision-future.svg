<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Slide 14: Vision, Summary & Contact Horizon -->
  <defs>
    <linearGradient id="horizonGlow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Horizon Arch & Perspective Rays -->
  <path d="M50 320 Q 300 200 550 320" stroke="#10b981" stroke-width="2" fill="url(#horizonGlow)"/>
  
  <line x1="300" y1="210" x2="100" y2="350" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="300" y1="210" x2="200" y2="350" stroke="#334155" stroke-width="1.5"/>
  <line x1="300" y1="210" x2="300" y2="350" stroke="#10b981" stroke-width="2"/>
  <line x1="300" y1="210" x2="400" y2="350" stroke="#334155" stroke-width="1.5"/>
  <line x1="300" y1="210" x2="500" y2="350" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Rising Core Sun / Vision Node -->
  <circle cx="300" cy="200" r="45" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <circle cx="300" cy="200" r="28" fill="#10b981" fill-opacity="0.2"/>
  <rect x="282" y="182" width="36" height="36" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
  <text x="300" y="206" fill="#34d399" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">چک</text>

  <!-- Floating Value Constellations -->
  <g transform="translate(140, 110)">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#34d399" stroke-width="1.5"/>
    <text x="0" y="5" fill="#34d399" font-family="sans-serif" font-size="12" text-anchor="middle">⚡</text>
    <text x="0" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">نقدشوندگی سریع</text>
  </g>

  <g transform="translate(460, 110)">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="5" fill="#60a5fa" font-family="sans-serif" font-size="12" text-anchor="middle">🛡</text>
    <text x="0" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">امنیت و شفافیت</text>
  </g>

  <g transform="translate(300, 70)">
    <circle cx="0" cy="0" r="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="5" fill="#fbbf24" font-family="sans-serif" font-size="12" text-anchor="middle">✦</text>
    <text x="0" y="28" fill="#cbd5e1" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">دموکراسی سرمایه</text>
  </g>
</svg>
