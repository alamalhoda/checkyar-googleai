<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Slide 12: Traction & Status -->
  <g transform="translate(60, 60)">
    <!-- Milestone Progress Line -->
    <path d="M40 80 L 440 80" stroke="#1e293b" stroke-width="3"/>
    <path d="M40 80 L 320 80" stroke="#10b981" stroke-width="3"/>

    <!-- Node 1: Architecture & Design System -->
    <g transform="translate(40, 80)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#34d399"/>
      <text x="0" y="-22" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">معماری و طراحی</text>
      <text x="0" y="25" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">طراحی لایه‌ای و SSOT</text>
    </g>

    <!-- Node 2: Core Engineering (Vue 3 / DRF) -->
    <g transform="translate(180, 80)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
      <circle cx="0" cy="0" r="6" fill="#34d399"/>
      <text x="0" y="-22" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">توسعه فرانت و بک</text>
      <text x="0" y="25" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">۱۸ ویو، استورها، صف‌ها</text>
    </g>

    <!-- Node 3: v1 Pilot Ready (Current) -->
    <g transform="translate(320, 80)">
      <circle cx="0" cy="0" r="18" fill="#10b981" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="0" r="7" fill="#020617"/>
      <text x="0" y="-26" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">v1 آماده پایلوت</text>
      <text x="0" y="30" fill="#34d399" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">وضعیت فعلی (Active)</text>
    </g>

    <!-- Node 4: Public Launch -->
    <g transform="translate(440, 80)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#64748b"/>
      <text x="0" y="-22" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">عرضه عمومی</text>
      <text x="0" y="25" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">پس از نتایج پایلوت</text>
    </g>

    <!-- 3 Metrics Highlights -->
    <g transform="translate(0, 145)">
      <rect width="150" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="10">پوشش جریان‌های کاربری</text>
      <text x="20" y="62" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="bold">۱۰۰٪</text>
      <text x="75" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10">مسیرهای حیاتی</text>
    </g>

    <g transform="translate(165, 145)">
      <rect width="150" height="90" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <text x="20" y="32" fill="#94a3b8" font-family="sans-serif" font-size="10">تست‌های یکپارچگی</text>
      <text x="20" y="62" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="bold">Passed</text>
      <text x="95" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10">سبز کامل</text>
    </g>

    <g transform="translate(330, 145)">
      <rect width="150" height="90" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="32" fill="#34d399" font-family="sans-serif" font-size="10">آمادگی پایلوت</text>
      <text x="20" y="62" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Ready</text>
      <text x="85" y="62" fill="#34d399" font-family="sans-serif" font-size="10">۵۰+ کسب‌وکار</text>
    </g>
  </g>
</svg>
