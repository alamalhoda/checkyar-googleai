<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Slide 4: Market Size - TAM / SAM / SOM Concentric & Bar Dynamics -->
  <defs>
    <linearGradient id="tamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="samGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Left: Concentric Circles -->
  <g transform="translate(190, 200)">
    <!-- TAM Circle -->
    <circle cx="0" cy="0" r="140" fill="url(#tamGrad)" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="-105" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">TAM: کل چک‌های مبادله‌ای صیادی</text>
    <text x="0" y="-88" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">+۵۰۰۰ همت سالانه</text>

    <!-- SAM Circle -->
    <circle cx="0" cy="15" r="95" fill="url(#samGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="-30" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SAM: بازار تنزیل و نقدشوندگی B2B</text>
    <text x="0" y="-12" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">~۵۰۰ همت</text>

    <!-- SOM Circle -->
    <circle cx="0" cy="40" r="55" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="2"/>
    <text x="0" y="32" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SOM: پایلوت و فاز ۱</text>
    <text x="0" y="52" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">۵ تا ۱۵ همت</text>
  </g>

  <!-- Right: Metrics Cards & Visual Growth Bars -->
  <g transform="translate(370, 70)">
    <rect width="180" height="75" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="10">گردش چک‌های صیاد</text>
    <text x="20" y="56" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">۵۰۰+ میلیون</text>
    <text x="140" y="56" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">فقره/سال</text>
  </g>

  <g transform="translate(370, 160)">
    <rect width="180" height="75" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="10">بنگاه‌های هدف (SMEs)</text>
    <text x="20" y="56" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">۴۰۰,۰۰۰+</text>
    <text x="135" y="56" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">شرکت فعال</text>
  </g>

  <g transform="translate(370, 250)">
    <rect width="180" height="75" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.8"/>
    <text x="20" y="30" fill="#34d399" font-family="sans-serif" font-size="10">فرصت نقدشوندگی دیجیتال</text>
    <text x="20" y="56" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">۸۵٪</text>
    <text x="80" y="56" fill="#cbd5e1" font-family="sans-serif" font-size="10">بازار سنتی آفلاین</text>
  </g>
</svg>
