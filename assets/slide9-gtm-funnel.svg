<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" fill="none">
  <!-- Slide 9: Go-To-Market Funnel / Expansion -->
  <g transform="translate(60, 60)">
    <!-- Stage 1: Controlled Pilot -->
    <g transform="translate(0, 0)">
      <polygon points="0,0 480,0 430,70 50,70" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <rect x="65" y="16" width="30" height="30" rx="8" fill="#10b981" fill-opacity="0.2"/>
      <text x="80" y="36" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">۱</text>
      <text x="110" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">فاز ۱: پایلوت کنترل‌شده (Controlled Pilot)</text>
      <text x="110" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">همکاری با ۵۰ شرکت معتمد، اصناف بنکداری و صادرکنندگان رتبه A</text>
      <rect x="360" y="20" width="85" height="24" rx="6" fill="#10b981"/>
      <text x="402" y="36" fill="#020617" font-family="sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">آماده اجرا</text>
    </g>

    <!-- Stage 2: B2B Networks & Supply Chains -->
    <g transform="translate(0, 80)">
      <polygon points="50,0 430,0 380,70 100,70" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="115" y="16" width="30" height="30" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
      <text x="130" y="36" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">۲</text>
      <text x="155" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">فاز ۲: اتصال زنجیره‌های تامین و پلتفرم‌های B2B</text>
      <text x="155" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">صنایع پخش، تجهیزات ساختمانی، قطعات خودرو و پخش دارو</text>
    </g>

    <!-- Stage 3: National Scale & Institutional Investors -->
    <g transform="translate(0, 160)">
      <polygon points="100,0 380,0 320,70 160,70" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="165" y="16" width="30" height="30" rx="8" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="180" y="36" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">۳</text>
      <text x="205" y="30" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">فاز ۳: مقیاس کشوری و جذب سرمایه‌گذاران نهادی</text>
      <text x="205" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">صندوق‌های درآمد ثابت، هلدینگ‌های مالی و تنزیل سراسری</text>
    </g>
  </g>
</svg>
