      <text x="68" y="36" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">بک‌اند و موتور منطق</text>
      <text x="68" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">Modular Monolith / doion</text>

