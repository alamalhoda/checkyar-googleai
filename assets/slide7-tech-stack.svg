    <!-- Center Bridge Line -->
    <path d="M225 130 L 255 130" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="240" y="120" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">REST API</text>

    <!-- Backend Stack Box -->
    <g transform="translate(255, 0)">
      <rect width="225" height="260" rx="14" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
